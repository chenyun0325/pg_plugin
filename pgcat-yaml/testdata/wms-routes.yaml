transform:
  - source-table: StoreServer.mem_customer_tracking
    projection: "*, json_int(param, 'outbound_id') AS outbound_id"
  - source-table: 'StoreServer.mem_customer_amaz_order,StoreServer.mem_customer_amaz_order_[0-9]+,StoreServer.mem_customer_amaz_order_history'
    projection: "*, __table_name__ || '_' || id AS _pk_id"
    primary-keys: _pk_id
  - source-table: 'StoreServer.mem_customer_amaz_order_item,StoreServer.mem_customer_amaz_order_item_[0-9]+,StoreServer.mem_customer_amaz_order_item_history'
    projection: "*, __table_name__ || '_' || id AS _pk_id"
    primary-keys: _pk_id
  - source-table: 'StoreServer.mem_customer_walmart_order,StoreServer.mem_customer_walmart_order_[0-9]+,StoreServer.mem_customer_walmart_order_history'
    projection: "*, __table_name__ || '_' || id AS _pk_id"
    primary-keys: _pk_id
  - source-table: 'StoreServer.mem_customer_walmart_order_item,StoreServer.mem_customer_walmart_order_item_[0-9]+,StoreServer.mem_customer_walmart_order_item_history'
    projection: "*, __table_name__ || '_' || id AS _pk_id"
    primary-keys: _pk_id
  - source-table: 'StoreServer.sys_warehouse_outbound,StoreServer.sys_warehouse_outbound_([0-9]+|[0-9]+_history)'
    projection: "*, 1 AS wh_type, __table_name__ || '_' || outbound_id AS _pk_id"
    primary-keys: _pk_id
  - source-table: StoreServer.mem_supplier_warehouse_outbound
    projection: "*, 2 AS wh_type, __table_name__ || '_' || outbound_id AS _pk_id"
    primary-keys: _pk_id
  - source-table: StoreServer.thd_warehouse_outbound
    projection: "*, 3 AS wh_type, __table_name__ || '_' || outbound_id AS _pk_id"
    primary-keys: _pk_id
  - source-table: 'StoreServer.sys_warehouse_outbound_tracking,StoreServer.sys_warehouse_outbound_tracking_([0-9]+|[0-9]+_history),StoreServer.thd_warehouse_outbound_tracking,StoreServer.mem_supplier_warehouse_outbound_tracking'
    projection: "*, __table_name__ || '_' || outbound_id AS _pk_id"
    primary-keys: _pk_id,tracking_number,delete
  - source-table: 'StoreServer.sys_warehouse_outbound_upload_file_record,StoreServer.sys_warehouse_outbound_upload_file_record_([0-9]+|[0-9]+_history),StoreServer.thd_warehouse_outbound_upload_file_record,StoreServer.mem_supplier_warehouse_outbound_upload_file_record'
    projection: "*, __table_name__ || '_' || id AS _pk_id"
    primary-keys: _pk_id
  - source-table: 'StoreServer.sys_warehouse_outbound_product,StoreServer.sys_warehouse_outbound_product_([0-9]+|[0-9]+_history),StoreServer.thd_warehouse_outbound_product,StoreServer.mem_supplier_warehouse_outbound_product'
    projection: "*, __table_name__ || '_' || outbound_id AS _pk_id"
    primary-keys: _pk_id,upc
  - source-table: 'StoreServer.sys_warehouse_outbound_sn_record,StoreServer.sys_warehouse_outbound_sn_record_history,StoreServer.sys_warehouse_outbound_sn_record_([0-9]+|[0-9]+_history),StoreServer.thd_warehouse_outbound_sn_record,StoreServer.mem_supplier_warehouse_outbound_sn_record,StoreServer.mem_supplier_warehouse_outbound_sn_record_history'
    projection: "*, __table_name__ || '_' || id AS _pk_id"
    primary-keys: _pk_id
  - source-table: 'StoreServer.sys_warehouse_outbound_product_bo_sn,StoreServer.sys_warehouse_outbound_product_bo_sn_([0-9]+|[0-9]+_history),StoreServer.thd_warehouse_outbound_product_bo_sn'
    projection: "*, __table_name__ || '_' || outbound_id AS _pk_id"
    primary-keys: _pk_id,upc,bo_sn
