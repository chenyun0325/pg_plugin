services:
  mysql:
    image: mysql:8.0.44
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
      MYSQL_ROOT_HOST: '%'
    command: ['--server-id=101', '--log-bin=lab-bin', '--binlog-format=ROW', '--binlog-row-image=FULL', '--default-time-zone=+00:00']
    ports: ['127.0.0.1:53306:3306']
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 --silent']
      interval: 2s
      timeout: 3s
      retries: 30
  postgres:
    image: postgres:18
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
    command: ['postgres', '-c', 'wal_level=logical', '-c', 'max_replication_slots=16']
    ports: ['127.0.0.1:56543:5432']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 2s
      timeout: 3s
      retries: 30
