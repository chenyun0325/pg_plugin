version: 1
job: pgcat_reverse
source:
  id: inventory_merged
  dsn-env: UID_LAB_MERGED_DSN
  publication: inv_reverse
  slot: inv_reverse
  plugin: pgoutput
  snapshot: seed
sink:
  id: inventory_mirror
  dsn-env: UID_LAB_MIRROR_DSN
  origin: inv_reverse_origin
replay-v2:
  namespace: inventory
  direction: reverse
  uid-field: uid
  peer-origin: inv_forward_origin
route:
  - name: summary
    source-table: 'inventory_app\.summary'
    sink-table: inventory_reverse.summary_delta
    source-key: [uid]
    primary-keys: [uid]
    include-all: true
