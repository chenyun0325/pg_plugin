services:
  source-db:
    image: postgres:18
    environment:
      POSTGRES_DB: source_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_replication_slots=20
      - -c
      - max_wal_senders=20
    ports:
      - "55432:5432"
    volumes:
      - source-data:/var/lib/postgresql/data
      - ./source.sql:/docker-entrypoint-initdb.d/01-source.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d source_db"]
      interval: 2s
      timeout: 2s
      retries: 30

  target-db:
    image: postgres:18
    environment:
      POSTGRES_DB: target_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_replication_slots=20
      - -c
      - max_wal_senders=20
    ports:
      - "55433:5432"
    volumes:
      - target-data:/var/lib/postgresql/data
      - ./target.sql:/docker-entrypoint-initdb.d/01-target.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d target_db"]
      interval: 2s
      timeout: 2s
      retries: 30

  nats:
    image: nats:2.11-alpine
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - nats-data:/data

volumes:
  source-data:
  target-data:
  nats-data:
